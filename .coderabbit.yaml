language: ko-KR

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  changed_files_summary: true
  estimate_code_review_effort: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "release-be"
      - "release-fe"
      - "release-app"

  path_instructions:
    - path: "**/*"
      instructions: |
        리뷰는 기능 오류, 보안 문제, 데이터 정합성 문제, 명시적인 팀 컨벤션 위반을 우선한다.
        컨벤션에 없는 설계 선택은 임의로 규칙화하지 말고 질문한다.

    - path: "BE/**/*.java"
      instructions: |
        기본 계층은 Controller → Service → Repository → Dao / Mapper다.
        Controller가 Dao/Mapper를 직접 호출하거나 Domain이 persistence Entity를 참조하면 안 된다.
        요청 DTO는 Bean Validation과 @Valid를 사용한다.
        Domain/Service에서 HttpStatus를 직접 선택하지 않는다.
        조회 Service에는 @Transactional(readOnly = true)를 사용한다.
        Lombok을 새로 사용하지 않는다.

    - path: "BE/**/*Exception*.java"
      instructions: |
        내부 예외 메시지와 클라이언트 공개 정보를 분리한다.
        BusinessException은 ClientError와 로그용 message를 가진다.
        ErrorResponse에는 ClientError의 숫자형 errorCode와 공개 message만 전달한다.
        ErrorResponse.message에 ex.getMessage(), stack trace, SQL, 외부 API 원문을 넣지 않는다.
        오류 코드는 docs/convention/error-handling.md와 Notion 오류 코드 데이터베이스를 확인하고 임의로 추가·변경하지 않는다.

    - path: "BE/**/*ExceptionHandler*.java"
      instructions: |
        ResponseEntityExceptionHandler를 상속하고 super.handleExceptionInternal(...) 처리 경로를 유지한다.
        실제 HTTP status는 ClientError.httpStatus와 같아야 한다.
        일반 오류 응답은 errorCode와 message만 사용한다.
        검증 오류만 문서화된 errors 확장 필드를 사용할 수 있다.
        예상 가능한 4xx는 WARN, 예상하지 못한 5xx는 원인 예외와 함께 ERROR로 기록한다.

    - path: "BE/src/test/**/*.java"
      instructions: |
        책임과 가까운 작은 테스트를 우선한다.
        테스트 메서드는 should[ExpectedBehavior]When[Condition] 형식의 lowerCamelCase를 사용한다.
        @DisplayName은 자연스러운 한국어로 작성한다.
        예외 테스트는 예외 타입과 hasMessage를 검증한다.
        ErrorResponse의 errorCode, message와 내부 메시지 비노출을 검증한다.
        DB 테스트는 H2를 사용하고 외부 Provider는 실제 호출하지 않는다.

    - path: "docs/convention/**/*.md"
      instructions: |
        code-convention.md, error-handling.md, test-strategy.md, git-convention.md를 기준으로 문서를 검토한다.
        오류 코드 추가·변경 시 error-handling.md와 Notion 오류 코드 데이터베이스도 함께 확인한다.

  pre_merge_checks:
    title:
      mode: warning
      requirements: |
        release-*를 대상으로 하는 작업 PR 제목은 [TSK-###] Task ID로 시작해야 한다.
        release-*에서 main으로 반영하는 PR은 버전 정보를 제목에 포함한다.

    custom_checks:
      - name: "PR 크기"
        mode: warning
        instructions: |
          핵심 변경 코드는 200줄 이하, 핵심 변경 파일은 5개 이하를 권장한다.
          핵심 변경 코드가 350줄 초과하거나 파일이 10개 초과하면 PR 분할을 검토한다.

      - name: "Backend 계층 규칙"
        mode: warning
        instructions: |
          Controller의 Dao/Mapper 직접 호출, Domain의 Entity 참조,
          Dao의 Domain 직접 조립, Domain/Service의 HttpStatus 사용을 검토한다.

      - name: "오류 정보 노출"
        mode: error
        instructions: |
          ex.getMessage()를 ErrorResponse.message로 반환하거나,
          stack trace·내부 Exception class·SQL·외부 API 민감 원문을 응답에 포함하면 실패한다.
