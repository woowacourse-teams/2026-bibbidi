map_hash_bucket_size 128;

include /etc/nginx/secrets/ingest-token.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name monitoring.bibbidi.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name monitoring.bibbidi.kr;

    ssl_certificate     /etc/letsencrypt/live/monitoring.bibbidi.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.bibbidi.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /metrics {
        return 404;
    }

    location = /loki/otlp/v1/logs {
        if ($ingest_authorized = 0) { return 401; }
        access_log off;
        client_max_body_size 10m;
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:3100/otlp/v1/logs;
    }

    location = /loki/api/v1/push {
        if ($ingest_authorized = 0) { return 401; }
        access_log off;
        client_max_body_size 10m;
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:3100/loki/api/v1/push;
    }

    location = /tempo/v1/traces {
        if ($ingest_authorized = 0) { return 401; }
        access_log off;
        client_max_body_size 10m;
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:4318/v1/traces;
    }

    location = /prometheus/api/v1/write {
        if ($ingest_authorized = 0) { return 401; }
        access_log off;
        client_max_body_size 10m;
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:9090/api/v1/write;
    }

    location /api/live/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }
}