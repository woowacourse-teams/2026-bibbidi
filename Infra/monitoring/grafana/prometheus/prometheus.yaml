global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["127.0.0.1:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["127.0.0.1:3000"]