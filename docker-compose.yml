services:
  mysql:
    image: mysql:8.0
    container_name: bibbidi-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bibbidi
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - bibbidi-mysql-data:/var/lib/mysql
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

volumes:
  bibbidi-mysql-data:
