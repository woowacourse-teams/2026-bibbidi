spring:
  datasource:
    url: jdbc:h2:mem:bibbidi-test
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

  sql:
    init:
      mode: never
