spring:
  ai:
    bedrock:
      converse:
        chat:
          model: ${bibbidi.ai.chatbot.sol-model}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bibbidi}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 110000
      keepalive-time: 30000
      connection-test-query: "SELECT 1"

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

bibbidi:
  balance-game:
    image-base-url: ${BIBBIDI_BALANCE_GAME_IMAGE_BASE_URL:https://www.bibbidi.kr}
  ai:
    chatbot:
      accounts-enabled: ${BIBBIDI_CHAT_ACCOUNTS_ENABLED:true}
