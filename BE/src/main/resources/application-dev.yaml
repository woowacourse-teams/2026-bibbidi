spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:bibbidi;MODE=MySQL;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: always
      data-locations:
        - classpath:load_catalog.sql
        - classpath:load_terms.sql
        - classpath:load_dev_users.sql

  flyway:
    enabled: false

  ai:
    model:
      chat: bedrock-converse
    bedrock:
      converse:
        chat:
          model: qwen.qwen3-235b-a22b-2507-v1:0

bibbidi:
  ai:
    chatbot:
      accounts-enabled: ${BIBBIDI_CHAT_ACCOUNTS_ENABLED:false}

management:
  metrics:
    tags:
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT_NAME:dev}
