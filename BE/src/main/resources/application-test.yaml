spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:bibbidi;MODE=MySQL;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

bibbidi:
  ai:
    chatbot:
      accounts-enabled: false

management:
  metrics:
    tags:
      deployment.environment.name: test
