spring:
  application:
    name: ${OTEL_SERVICE_NAME:bibbidi-backend}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bibbidi}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 110000
      keepalive-time: 30000
      connection-test-query: "SELECT 1"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  sql:
    init:
      mode: never

server:
  servlet:
    session:
      timeout: 24h
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service.name: ${OTEL_SERVICE_NAME:bibbidi-backend}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT_NAME:production}
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy:4318}

logging:
  structured:
    format:
      console: ecs
  include-application-name: false
