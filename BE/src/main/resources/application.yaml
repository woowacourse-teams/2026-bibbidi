spring:
  application:
    name: ${OTEL_SERVICE_NAME:bibbidi-backend}

  jpa:
    open-in-view: false
    show-sql: false

  sql:
    init:
      mode: never

discord:
  url:
    feedback: ${DISCORD_FEEDBACK_WEB_HOOK_URL:}

bibbidi:
  jwt:
    issuer: https://api.bibbidi.kr
    audience: bibbidi-api
    access-token-ttl: 30m
    refresh-token-ttl: 30d
    active-key-id: ${BIBBIDI_JWT_ACTIVE_KEY_ID:}
    active-private-key: ${BIBBIDI_JWT_ACTIVE_PRIVATE_KEY:}
    retired-public-keys: ${BIBBIDI_JWT_RETIRED_PUBLIC_KEYS:}
  auth:
    web:
      refresh-cookie-name: BIBBIDI_REFRESH
      refresh-cookie-path: /api/auth/tokens
      refresh-cookie-secure: true
      allowed-origins: ${BIBBIDI_ALLOWED_ORIGINS:}


server:
  servlet:
    session:
      timeout: 24h
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service.name: ${OTEL_SERVICE_NAME:bibbidi-backend}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT_NAME:production}
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy:4318}

logging:
  structured:
    format:
      console: ecs
  include-application-name: false

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bibbidi}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 110000
      keepalive-time: 30000
      connection-test-query: "SELECT 1"

  jpa:
    hibernate:
      ddl-auto: validate

---
spring:
  config:
    activate:
      on-profile: "!prod"

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:bibbidi;MODE=MySQL;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
