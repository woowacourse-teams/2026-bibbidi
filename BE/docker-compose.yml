services:
  mysql:
    image: mysql:8.0
    container_name: bibbidi-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bibbidi
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - bibbidi-mysql-data:/var/lib/mysql
      - ./database/mysql/bibbidi_mvp_schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

volumes:
  bibbidi-mysql-data:
