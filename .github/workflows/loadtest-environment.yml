name: 비비디 부하 테스트 환경

on:
  workflow_dispatch:
    inputs:
      action:
        description: 스택을 만들거나 지운다
        type: choice
        options:
          - create
          - delete
        required: true
      round-id:
        description: "회차 이름(소문자·숫자·하이픈). 예: q1-r1"
        type: string
        required: true
      image-tag:
        description: "create 전용: 테스트할 백엔드 이미지 태그(커밋 SHA)"
        type: string
        required: false
      config-ref:
        description: "create 전용: compose·nginx 파일을 받을 Git ref"
        type: string
        default: dev-be
        required: false
      auto-stop-hours:
        description: "create 전용: 인스턴스가 켜진 뒤 이 시간이 지나면 스스로 중지합니다(지우는 것을 잊었을 때의 안전장치)"
        type: string
        default: "8"
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: loadtest-environment-${{ inputs.round-id }}
  cancel-in-progress: false

jobs:
  stack:
    runs-on: ubuntu-latest
    environment: loadtest
    timeout-minutes: 40
    env:
      ROUND_ID: ${{ inputs.round-id }}
      STACK_NAME: bibbidi-loadtest-${{ inputs.round-id }}
      PARAM_PREFIX: /bibbidi/loadtest/${{ inputs.round-id }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.LOADTEST_AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 스택 만들기
        if: inputs.action == 'create'
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          CONFIG_REF: ${{ inputs.config-ref }}
          AUTO_STOP_HOURS: ${{ inputs.auto-stop-hours }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ALLOY_ENV_CONTENT: ${{ secrets.BIBBIDI_ALLOY_ENV }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_TAG" || { echo "::error::create에는 image-tag가 필요합니다."; exit 1; }
          # JWT 비밀값과 DB 비밀번호, SSH 키는 회차마다 새로 만든다.
          # k6 워크플로가 JWT 값과 개인키를 다시 읽을 수 있도록 SSM Parameter Store에 둔다.
          AUTH_JWT_SECRET="$(openssl rand -hex 32)"
          DB_PASSWORD="$(openssl rand -hex 16)"
          MONITORING_INGEST_TOKEN="$(printf '%s\n' "$ALLOY_ENV_CONTENT" \
            | tr -d '\r' \
            | sed -n -E 's/^(export )?MONITORING_INGEST_TOKEN=//p' \
            | head -n 1 \
            | sed -E "s/^(\"|')//; s/(\"|')$//")"
          test -n "$MONITORING_INGEST_TOKEN" || { echo "::error::BIBBIDI_ALLOY_ENV에서 MONITORING_INGEST_TOKEN을 찾지 못했습니다."; exit 1; }
          for secret in "$DOCKERHUB_TOKEN" "$AUTH_JWT_SECRET" "$MONITORING_INGEST_TOKEN" "$DB_PASSWORD"; do
            echo "::add-mask::$secret"
          done
          ssh-keygen -q -t ed25519 -N '' -C "loadtest-$ROUND_ID" -f "$RUNNER_TEMP/loadtest_key"
          aws ssm put-parameter --name "$PARAM_PREFIX/jwt-secret" --type SecureString --overwrite --value "$AUTH_JWT_SECRET" >/dev/null
          aws ssm put-parameter --name "$PARAM_PREFIX/ssh-key" --type SecureString --overwrite --value "file://$RUNNER_TEMP/loadtest_key" >/dev/null
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file Infra/loadtest/loadtest-environment.yaml \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "RoundId=$ROUND_ID" \
              "ImageTag=$IMAGE_TAG" "ConfigRef=$CONFIG_REF" "AutoStopHours=$AUTO_STOP_HOURS" \
              "DockerHubUsername=$DOCKERHUB_USERNAME" "DockerHubToken=$DOCKERHUB_TOKEN" \
              "AuthJwtSecret=$AUTH_JWT_SECRET" "MonitoringIngestToken=$MONITORING_INGEST_TOKEN" \
              "DbPassword=$DB_PASSWORD" "SshPublicKey=$(cat "$RUNNER_TEMP/loadtest_key.pub")"
          base_url="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BaseUrl'].OutputValue" --output text)"
          {
            echo "### 부하 테스트 환경을 만들었습니다"
            echo "- 스택: \`$STACK_NAME\`"
            echo "- BaseUrl(부하 발생기에서만 접근 가능): \`$base_url\`"
            echo "- 이미지 태그: \`$IMAGE_TAG\`, 설정 ref: \`$CONFIG_REF\`"
            echo "- 실행: \`k6/loadtest/<스크립트>/$ROUND_ID\` 태그를 푸시합니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 스택 지우기
        if: inputs.action == 'delete'
        run: |
          set -euo pipefail
          aws cloudformation delete-stack --stack-name "$STACK_NAME"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
          aws ssm delete-parameters --names "$PARAM_PREFIX/jwt-secret" "$PARAM_PREFIX/ssh-key" >/dev/null
          echo "### 부하 테스트 환경을 지웠습니다: \`$STACK_NAME\`" >> "$GITHUB_STEP_SUMMARY"
