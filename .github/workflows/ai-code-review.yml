name: Bibbidi AI Code Review Harness

on:
  pull_request_target:
    types:
      - opened
      - ready_for_review
    branches:
      - release-be
      - release-fe
      - release-app

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review pull request
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # pull_request_target has access to secrets. Never check out or execute
      # code from github.event.pull_request.head.sha in this workflow.
      - name: Checkout trusted reviewer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Run AI review
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_PULL_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_EVENT: ${{ github.event.action }}
        run: node .github/scripts/ai-review/cli.mjs
