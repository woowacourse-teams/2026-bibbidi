name: 비비디 부하 테스트

# `k6/loadtest/<스크립트>/<회차>` 태그를 푸시하면 태그가 가리키는 커밋으로
# 백엔드 이미지를 새로 빌드하고(build), 전용 환경을 새로 만들고(create), k6를 실행하고(k6-loadtest), 환경을 지운다(cleanup).
on:
  push:
    tags:
      - "k6/loadtest/**"

permissions:
  contents: read

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      script: ${{ steps.read.outputs.script }}
      round_id: ${{ steps.read.outputs.round_id }}
      test_id: ${{ steps.read.outputs.test_id }}
    steps:
      - name: 태그에서 실행 대상 읽기
        id: read
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REF_NAME" =~ ^k6/loadtest/(smoke-test|smoke-ai-test|ttft-ai-test|breakpoint-general-test|breakpoint-ai-arrival-test|breakpoint-ai-concurrency-test)/([a-z0-9-]{1,24})$ ]]; then
            echo "::error::태그 형식이 k6/loadtest/<스크립트>/<회차>와 맞지 않거나 허용하지 않는 스크립트입니다: $REF_NAME"
            exit 1
          fi
          {
            echo "script=${BASH_REMATCH[1]}"
            echo "round_id=${BASH_REMATCH[2]}"
            echo "test_id=${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          } >> "$GITHUB_OUTPUT"

  # 태그가 가리키는 커밋의 BE/로 백엔드 이미지를 새로 만든다. CD 이미지와 겹치지 않도록 태그에 loadtest- 를 붙인다.
  build:
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: JAR 만들기(테스트는 PR CI가 이미 돌렸으므로 건너뛴다)
        run: ./gradlew bootJar -x test -x jacocoTestReport -x jacocoTestCoverageVerification

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: ARM64 이미지 빌드와 푸시
        uses: docker/build-push-action@v7
        with:
          context: ./BE
          file: ./BE/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bibbidi-backend:loadtest-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bibbidi-backend:buildcache-loadtest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bibbidi-backend:buildcache-loadtest
          cache-to: type=inline

  create:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: loadtest
    outputs:
      owns_stack: ${{ steps.guard.outputs.owns_stack }}
    permissions:
      contents: read
      id-token: write
    env:
      ROUND_ID: ${{ needs.plan.outputs.round_id }}
      STACK_NAME: bibbidi-loadtest-${{ needs.plan.outputs.round_id }}
      PARAM_PREFIX: /bibbidi/loadtest/${{ needs.plan.outputs.round_id }}
      IMAGE_TAG: loadtest-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.LOADTEST_AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 태그가 가리키는 커밋의 이미지와 기존 스택 확인
        id: guard
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          # 이미지가 없으면 앱이 뜨지 못해 스택이 20분 뒤에야 실패하므로 먼저 막는다.
          docker manifest inspect "$DOCKERHUB_USERNAME/bibbidi-backend:$IMAGE_TAG" >/dev/null \
            || { echo "::error::백엔드 이미지($IMAGE_TAG)가 Docker Hub에 없습니다. build 잡의 결과를 확인하세요."; exit 1; }
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            echo "::error::스택 $STACK_NAME 이 이미 있습니다. 매번 새 환경에서 실행하므로 다른 회차 이름을 쓰세요."
            exit 1
          fi
          # 여기를 통과한 실행만 이 스택의 주인이다. cleanup은 주인일 때만 지운다.
          echo "owns_stack=true" >> "$GITHUB_OUTPUT"

      - name: 전용 환경 만들기
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ALLOY_ENV_CONTENT: ${{ secrets.BIBBIDI_ALLOY_ENV }}
        run: |
          set -euo pipefail
          # JWT 비밀값과 DB 비밀번호, SSH 키는 회차마다 새로 만든다.
          # k6 잡이 JWT 값과 개인키를 다시 읽을 수 있도록 SSM Parameter Store에 둔다.
          AUTH_JWT_SECRET="$(openssl rand -hex 32)"
          DB_PASSWORD="$(openssl rand -hex 16)"
          MONITORING_INGEST_TOKEN="$(printf '%s\n' "$ALLOY_ENV_CONTENT" \
            | tr -d '\r' \
            | sed -n -E 's/^(export )?MONITORING_INGEST_TOKEN=//p' \
            | head -n 1 \
            | sed -E "s/^(\"|')//; s/(\"|')$//")"
          test -n "$MONITORING_INGEST_TOKEN" || { echo "::error::BIBBIDI_ALLOY_ENV에서 MONITORING_INGEST_TOKEN을 찾지 못했습니다."; exit 1; }
          for secret in "$DOCKERHUB_TOKEN" "$AUTH_JWT_SECRET" "$MONITORING_INGEST_TOKEN" "$DB_PASSWORD"; do
            echo "::add-mask::$secret"
          done
          ssh-keygen -q -t ed25519 -N '' -C "loadtest-$ROUND_ID" -f "$RUNNER_TEMP/loadtest_key"
          aws ssm put-parameter --name "$PARAM_PREFIX/jwt-secret" --type SecureString --overwrite --value "$AUTH_JWT_SECRET" >/dev/null
          aws ssm put-parameter --name "$PARAM_PREFIX/ssh-key" --type SecureString --overwrite --value "file://$RUNNER_TEMP/loadtest_key" >/dev/null
          # 회차 조건은 태그가 가리키는 커밋의 Infra/loadtest/params/<회차>.params 에 둔다(없으면 기본값).
          # 한 줄에 `파라미터=값` 하나이고 허용 목록에 있는 이름만 받는다. 비밀값과 이미지는 바꿀 수 없다.
          allowed=" AppInstanceType DbInstanceType LoadGeneratorInstanceType MysqlImage MysqlMaxConnections MysqlBufferPoolSize DbPoolSize NginxApiRateLimit NginxApiConnLimit LoadTestTtftMs LoadTestChunkIntervalMs LoadTestChunks LoadTestThrottleRatio AutoStopHours "
          overrides=()
          params_file="Infra/loadtest/params/$ROUND_ID.params"
          if [ -f "$params_file" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              case "$line" in ''|'#'*) continue ;; esac
              key="${line%%=*}"
              [[ "$line" == *=* && "$allowed" == *" $key "* ]] || { echo "::error::$params_file 에서 허용하지 않는 줄입니다: $line"; exit 1; }
              overrides+=("$line")
              echo "파라미터 적용: $line"
            done < "$params_file"
          fi
          # 템플릿과 compose·nginx 파일은 태그가 가리키는 커밋, 백엔드 이미지는 build 잡이 그 커밋으로 만든 것이다.
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file Infra/loadtest/loadtest-environment.yaml \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "RoundId=$ROUND_ID" \
              "ImageTag=$IMAGE_TAG" "ConfigRef=$GITHUB_SHA" \
              "DockerHubUsername=$DOCKERHUB_USERNAME" "DockerHubToken=$DOCKERHUB_TOKEN" \
              "AuthJwtSecret=$AUTH_JWT_SECRET" "MonitoringIngestToken=$MONITORING_INGEST_TOKEN" \
              "DbPassword=$DB_PASSWORD" "SshPublicKey=$(cat "$RUNNER_TEMP/loadtest_key.pub")" \
              "${overrides[@]}"
          {
            echo "### 부하 테스트 환경을 만들었습니다"
            echo "- 스택: \`$STACK_NAME\`"
            echo "- 커밋(템플릿·설정 ref): \`$GITHUB_SHA\`"
            echo "- 백엔드 이미지: \`$IMAGE_TAG\`"
            echo "- 적용한 파라미터: ${overrides[*]:-없음(기본값)}"
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub 호스팅 러너가 SSM 터널 SSH로 부하 발생기 EC2에 접속해 k6를 돌린다.
  k6-loadtest:
    needs: [plan, create]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: loadtest
    permissions:
      contents: read
      id-token: write
    env:
      SCRIPT: ${{ needs.plan.outputs.script }}
      ROUND_ID: ${{ needs.plan.outputs.round_id }}
      TEST_ID: ${{ needs.plan.outputs.test_id }}
      REPORT_DIR: ${{ github.workspace }}/k6-report
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.LOADTEST_AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: SSM 세션 플러그인 설치
        run: |
          set -euo pipefail
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "$RUNNER_TEMP/ssm-plugin.deb"
          sudo dpkg -i "$RUNNER_TEMP/ssm-plugin.deb"

      - name: 부하 발생기 접속 준비
        env:
          ALLOY_ENV_CONTENT: ${{ secrets.BIBBIDI_ALLOY_ENV }}
        run: |
          set -euo pipefail
          prefix="/bibbidi/loadtest/$ROUND_ID"
          stack="bibbidi-loadtest-$ROUND_ID"
          output() {
            aws cloudformation describe-stacks --stack-name "$stack" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          generator_id="$(output LoadGeneratorInstanceId)"
          base_url="$(output BaseUrl)"
          jwt_secret="$(aws ssm get-parameter --name "$prefix/jwt-secret" --with-decryption --query Parameter.Value --output text)"
          ingest_token="$(printf '%s\n' "$ALLOY_ENV_CONTENT" \
            | tr -d '\r' \
            | sed -n -E 's/^(export )?MONITORING_INGEST_TOKEN=//p' \
            | head -n 1 \
            | sed -E "s/^(\"|')//; s/(\"|')$//")"
          test -n "$ingest_token" || { echo "::error::BIBBIDI_ALLOY_ENV에서 MONITORING_INGEST_TOKEN을 찾지 못했습니다."; exit 1; }
          for secret in "$jwt_secret" "$ingest_token"; do
            echo "::add-mask::$secret"
          done
          install -d -m 0700 ~/.ssh
          aws ssm get-parameter --name "$prefix/ssh-key" --with-decryption --query Parameter.Value --output text > ~/.ssh/loadtest_key
          chmod 600 ~/.ssh/loadtest_key
          cat > ~/.ssh/config <<CONFIG
          Host loadtest
            HostName $generator_id
            User ubuntu
            IdentityFile ~/.ssh/loadtest_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ProxyCommand aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p
          CONFIG
          # 비밀값은 인자가 아니라 원격의 600 파일로 전달한다.
          {
            printf 'export BASE_URL=%q\n' "$base_url"
            printf 'export AUTH_JWT_SECRET=%q\n' "$jwt_secret"
            printf 'export K6_PROMETHEUS_RW_BEARER_TOKEN=%q\n' "$ingest_token"
            echo 'export K6_NO_USAGE_REPORT=true'
            echo 'export K6_SYSTEM_TAGS=proto,status,method,name,group,check,error,error_code,tls_version,scenario,expected_response'
            echo 'export K6_PROMETHEUS_RW_SERVER_URL=https://monitoring.bibbidi.kr/prometheus/api/v1/write'
            echo 'export K6_PROMETHEUS_RW_TREND_STATS="p(95),p(99),avg,max"'
            echo "export K6_PROMETHEUS_RW_LABELS=target=loadtest,testid=$TEST_ID"
            echo 'export K6_PROMETHEUS_RW_STALE_MARKERS=true'
            echo 'export K6_PROMETHEUS_RW_PUSH_INTERVAL=1s'
            echo 'export K6_WEB_DASHBOARD=true'
            echo 'export K6_WEB_DASHBOARD_PORT=-1'
            echo 'export K6_WEB_DASHBOARD_EXPORT="$HOME/k6-run/k6-report/report.html"'
            echo 'export SUMMARY_DIR="$HOME/k6-run/k6-report"'
          } > "$RUNNER_TEMP/k6.env"

      - name: 스크립트와 설정 올리기
        run: |
          set -euo pipefail
          ssh loadtest 'rm -rf ~/k6-run && mkdir -p ~/k6-run/Infra ~/k6-run/k6-report && umask 077 && cat > ~/k6-run/.env' < "$RUNNER_TEMP/k6.env"
          scp -r Infra/k6 loadtest:'~/k6-run/Infra/'

      - name: k6 실행
        run: |
          set +e
          ssh loadtest "cd ~/k6-run && . ./.env && k6 run -o experimental-prometheus-rw --tag testid=$TEST_ID Infra/k6/$SCRIPT.ts"
          status=$?
          set -e
          if [ "$status" -eq 99 ] && [[ "$SCRIPT" == breakpoint-* ]]; then
            echo "임계값 중단은 Breakpoint의 정상 결과입니다."
            exit 0
          fi
          exit "$status"

      - name: 보고서 가져오기
        if: always()
        run: |
          mkdir -p "$REPORT_DIR"
          scp -r loadtest:'~/k6-run/k6-report/.' "$REPORT_DIR/" || echo "가져올 보고서가 없습니다."

      - name: 잡 요약에 판정표 남기기
        if: always()
        run: |
          if [ -f "$REPORT_DIR/report.md" ]; then
            cat "$REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 보고서 아티팩트 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-${{ env.TEST_ID }}
          path: ${{ env.REPORT_DIR }}
          retention-days: 90
          if-no-files-found: warn

  # 만들기나 테스트가 실패해도 환경은 지운다. 비밀값 파일(.env)도 환경과 함께 사라진다.
  cleanup:
    needs: [plan, create, k6-loadtest]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: loadtest
    permissions:
      contents: read
      id-token: write
    env:
      ROUND_ID: ${{ needs.plan.outputs.round_id }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.LOADTEST_AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 전용 환경 지우기
        if: ${{ needs.create.outputs.owns_stack == 'true' }}
        run: |
          set -euo pipefail
          stack="bibbidi-loadtest-$ROUND_ID"
          aws cloudformation delete-stack --stack-name "$stack"
          aws cloudformation wait stack-delete-complete --stack-name "$stack"
          aws ssm delete-parameters --names "/bibbidi/loadtest/$ROUND_ID/jwt-secret" "/bibbidi/loadtest/$ROUND_ID/ssh-key" >/dev/null
          echo "### 부하 테스트 환경을 지웠습니다: \`$stack\`" >> "$GITHUB_STEP_SUMMARY"
