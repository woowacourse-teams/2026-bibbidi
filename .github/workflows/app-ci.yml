name: App CI

on:
  pull_request:
    branches: [dev-app, release-app]
    paths:
      - APP/**
      - .github/workflows/app-ci.yml
  push:
    branches: [dev-app]
    paths:
      - APP/**
      - .github/workflows/app-ci.yml
  workflow_dispatch:

permissions:
  contents: read

# Public build checks use test-only hosts and never receive real endpoint secrets.
env:
  APP_DEV_API_HOST: dev-api.example.invalid
  APP_DEV_WEB_HOST: dev-web.example.invalid
  APP_PROD_API_HOST: api.example.invalid
  APP_PROD_WEB_HOST: web.example.invalid

concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Shared tests
            tasks: ':shared:testAndroidHostTest'
          - name: Android tests
            tasks: ':androidApp:testDevDebugUnitTest :androidApp:testProdReleaseUnitTest'
          - name: Android build
            tasks: ':androidApp:assembleDevDebug :androidApp:assembleDevRelease :androidApp:assembleProdRelease'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android SDK packages
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'"
      - name: Run Gradle checks
        working-directory: APP
        env:
          GRADLE_TASKS: ${{ matrix.tasks }}
        run: ./gradlew --no-daemon --stacktrace $GRADLE_TASKS
      - name: Upload test reports
        if: ${{ !cancelled() && matrix.name != 'Android build' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-reports
          path: |
            APP/**/build/reports/tests/
            APP/**/build/test-results/
          retention-days: 7

  ios:
    name: iOS ${{ matrix.check }}
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        check: [tests, build]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      RUN_IOS_UI_TESTS: ${{ github.event_name != 'pull_request' || github.base_ref == 'release-app' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Restore Kotlin/Native dependencies
        id: konan
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-*
          key: konan-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('APP/gradle/libs.versions.toml', 'APP/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Run shared tests on iOS Simulator
        if: matrix.check == 'tests'
        working-directory: APP
        run: ./gradlew --no-daemon --stacktrace :shared:iosSimulatorArm64Test
      - name: Prepare iOS test endpoints
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          names = ("APP_DEV_API_HOST", "APP_DEV_WEB_HOST", "APP_PROD_API_HOST", "APP_PROD_WEB_HOST")
          path = Path("APP/iosApp/config/Endpoints.local.xcconfig")
          path.write_text("".join(f"{name} = {os.environ[name]}\n" for name in names))
          PY
      - name: Build iOS Simulator app
        if: matrix.check == 'build'
        run: |
          for configuration in Debug DevRelease Release; do
            scheme='Bibbidi Dev'
            if [ "$configuration" = Release ]; then scheme=Bibbidi; fi
            xcodebuild -project APP/iosApp/iosApp.xcodeproj \
              -scheme "$scheme" -configuration "$configuration" -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "APP/iosApp/build/$configuration" \
              CODE_SIGNING_ALLOWED=NO build
          done
      - name: Prepare UI test Simulator
        if: matrix.check == 'tests' && env.RUN_IOS_UI_TESTS == 'true'
        timeout-minutes: 5
        run: |
          simulator_id=$(xcrun simctl create Bibbidi-CI com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "UI_TEST_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Run iOS app launch test
        if: matrix.check == 'tests' && env.RUN_IOS_UI_TESTS == 'true'
        timeout-minutes: 15
        run: >-
          xcodebuild -project APP/iosApp/iosApp.xcodeproj
          -scheme 'Bibbidi Dev' -configuration Debug
          -destination "platform=iOS Simulator,id=$UI_TEST_SIMULATOR_ID"
          -derivedDataPath APP/iosApp/build/DerivedData
          -resultBundlePath APP/iosApp/build/TestResults.xcresult
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Clean up UI test Simulator
        if: always() && matrix.check == 'tests' && env.UI_TEST_SIMULATOR_ID != ''
        timeout-minutes: 2
        run: |
          xcrun simctl shutdown "$UI_TEST_SIMULATOR_ID" || true
          xcrun simctl delete "$UI_TEST_SIMULATOR_ID"
      - name: Save Kotlin/Native dependencies from trusted branch
        if: success() && github.event_name != 'pull_request' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-*
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Upload iOS test reports
        if: ${{ !cancelled() && matrix.check == 'tests' }}
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-reports
          path: |
            APP/shared/build/reports/tests/
            APP/shared/build/test-results/
            APP/iosApp/build/TestResults.xcresult
          retention-days: 7
