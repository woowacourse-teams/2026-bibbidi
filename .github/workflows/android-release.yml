# KMP 전환 중에는 릴리스 배포를 실행하지 않습니다.
# #240에서 기존 android-release Environment Secrets를 새 Gradle 모듈에 연결합니다.
name: Android Release AAB (paused during KMP migration)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-paused:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release signing will be restored in issue 240."
