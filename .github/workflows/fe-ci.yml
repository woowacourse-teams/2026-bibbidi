name: Frontend CI

on:
  pull_request:
    branches:
      - dev-fe
      - release-fe
    paths:
      - FE/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - infra/frontend/**
      - .github/workflows/fe-ci.yml

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release scripts and CloudFront routing
        run: node --test infra/frontend/*.test.mjs

      - name: Lint
        run: pnpm --filter bibbidi-fe lint

      - name: Check formatting
        run: pnpm --filter bibbidi-fe format:check

      - name: Type check
        run: pnpm --filter bibbidi-fe typecheck

      - name: Test
        run: pnpm --filter bibbidi-fe test

      - name: Build static export
        env:
          BIBBIDI_CATALOG_API_ORIGIN: ${{ github.base_ref == 'release-fe' && 'https://api.bibbidi.kr' || 'https://dev-api.bibbidi.kr' }}
          BIBBIDI_API_BASE_URL: ${{ github.base_ref == 'release-fe' && 'https://api.bibbidi.kr' || 'https://dev-api.bibbidi.kr' }}
          FE_SERVICE_URL: ${{ github.base_ref == 'release-fe' && 'https://bibbidi.kr' || 'https://dev.bibbidi.kr' }}
        run: pnpm --filter bibbidi-fe build

      - name: Verify public export
        run: |
          test -f FE/out/index.html
          test -f FE/out/404.html
          if [ -n "$(find FE/out -type f -name '*.map' -print -quit)" ]; then
            echo "Source maps must not be present in the public export." >&2
            exit 1
          fi
