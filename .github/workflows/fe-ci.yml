name: Frontend CI

on:
  pull_request:
    branches:
      - release-fe
    paths:
      - FE/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/fe-ci.yml

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter bibbidi-fe lint

      - name: Check formatting
        run: pnpm --filter bibbidi-fe format:check

      - name: Type check
        run: pnpm --filter bibbidi-fe typecheck

      - name: Build
        run: pnpm --filter bibbidi-fe build
