name: Bibbidi Backend PROD CD

on:
  pull_request:
    types: [closed]
    branches: [release-be]
    paths:
      - "BE/**"
      - "Infra/monitoring/**"
      - "Infra/nginx/**"
      - "Infra/scripts/**"

permissions:
  contents: read

concurrency:
  group: backend-prod-deploy

jobs:
  build-and-push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: BE

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew clean build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./BE
          file: ./BE/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bibbidi-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux, ARM64, prod]

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install deployment configuration
        env:
          SPRING_ENV_CONTENT: ${{ secrets.BIBBIDI_SPRING_ENV }}
          NGINX_ENV_CONTENT: ${{ secrets.BIBBIDI_NGINX_ENV }}
          ALLOY_ENV_CONTENT: ${{ secrets.BIBBIDI_ALLOY_ENV }}
        run: |
          test -n "$SPRING_ENV_CONTENT"
          test -n "$NGINX_ENV_CONTENT"
          test -n "$ALLOY_ENV_CONTENT"
          install -d -m 0755 /opt/bibbidi/app/infra/monitoring/alloy
          install -d -m 0755 /opt/bibbidi/app/infra/nginx
          install -m 0644 BE/compose.prod.yaml /opt/bibbidi/app/compose.yaml
          install -m 0644 Infra/monitoring/alloy/config.alloy /opt/bibbidi/app/infra/monitoring/alloy/config.alloy
          install -m 0644 Infra/nginx/nginx.conf.template /opt/bibbidi/app/infra/nginx/nginx.conf.template
          umask 077
          printf '%s\n' "$SPRING_ENV_CONTENT" > /opt/bibbidi/app/.env.spring
          printf '%s\n' "$NGINX_ENV_CONTENT" > /opt/bibbidi/app/.env.nginx
          printf '%s\n' "$ALLOY_ENV_CONTENT" > /opt/bibbidi/app/infra/monitoring/.env.alloy

      - name: Prepare observability network
        run: docker network inspect bibbidi-observability >/dev/null 2>&1 || docker network create bibbidi-observability

      - name: Deploy and verify health
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd /opt/bibbidi/app

          docker network inspect bibbidi-observability >/dev/null 2>&1 || docker network create bibbidi-observability
          export NGINX_CONFIG_PATH=/opt/bibbidi/app/infra/nginx/nginx.conf
          export ALLOY_CONFIG_PATH=/opt/bibbidi/app/infra/monitoring/alloy/config.alloy
          export SPRING_ENV_FILE=/opt/bibbidi/app/.env.spring
          export ALLOY_ENV_FILE=/opt/bibbidi/app/infra/monitoring/.env.alloy
          export NGINX_ENV_FILE=/opt/bibbidi/app/.env.nginx
          export TLS_ENV_FILE=/opt/bibbidi/app/.env.nginx

          set -a
          . /opt/bibbidi/app/.env.spring
          . /opt/bibbidi/app/.env.nginx
          set +a
          envsubst '${SERVER_NAME} ${CERT_DOMAIN} ${NGINX_ALLOWED_ORIGIN}' \
            < /opt/bibbidi/app/infra/nginx/nginx.conf.template \
            > /opt/bibbidi/app/infra/nginx/nginx.conf

          docker compose config >/dev/null
          docker compose pull backend nginx alloy
          docker compose up -d backend nginx alloy

          if ! curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-delay 2 \
            --retry-connrefused \
            --retry-all-errors \
            http://127.0.0.1:8080/actuator/health \
            | grep --quiet '"status":"UP"'; then
            docker compose logs --tail=200 backend nginx alloy
            exit 1
          fi

          if ! curl --fail --silent http://127.0.0.1/healthz >/dev/null; then
            docker compose logs --tail=200 nginx alloy
            exit 1
          fi

          docker image prune --all --force
