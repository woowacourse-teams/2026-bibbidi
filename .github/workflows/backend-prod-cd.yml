name: 비비디 백엔드 운영 CD

on:
  push:
    branches: [release-be]
    paths:
      - "BE/**"
      - "Infra/monitoring/**"
      - "Infra/nginx/**"
      - "Infra/scripts/**"
      - ".github/workflows/backend-*-cd.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-prod-deploy
  cancel-in-progress: false

jobs:
  resolve-image:
    runs-on: ubuntu-24.04
    outputs:
      build-image: ${{ steps.resolve.outputs.build-image }}
      image-tag: ${{ steps.resolve.outputs.image-tag }}
    steps:
      - name: 승격 대상 확인을 위해 전체 Git 이력 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dev-be 또는 release-be hotfix 에서 배포할 이미지 결정
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          parent_count=$(git rev-list --parents -n 1 "$GITHUB_SHA" | awk '{print NF - 1}')
          if [ "$parent_count" -eq 2 ]; then
            promoted_sha=$(git rev-parse "$GITHUB_SHA^2")
            git fetch origin dev-be:refs/remotes/origin/dev-be
            if ! git merge-base --is-ancestor "$promoted_sha" origin/dev-be; then
              echo "::error::The second parent is not a commit from dev-be. Refusing production deployment."
              exit 1
            fi
            echo "build-image=false" >> "$GITHUB_OUTPUT"
            echo "image-tag=$promoted_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pull_request=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq 'map(select(.base.ref == "release-be" and (.head.ref | startswith("hotfix/")) and any(.labels[]; .name == "type: hotfix"))) | first')

          if [ -z "$pull_request" ] || [ "$pull_request" = "null" ]; then
            echo "::error::release-be contains neither a dev-be merge nor an approved hotfix PR."
            exit 1
          fi

          echo "build-image=true" >> "$GITHUB_OUTPUT"
          echo "image-tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve-image
    uses: ./.github/workflows/backend-common-cd.yml
    secrets: inherit
    with:
      deployment-environment: backend-prod
      runner-labels: '["self-hosted", "linux", "ARM64", "prod"]'
      image-tag: ${{ needs.resolve-image.outputs.image-tag }}
      build-image: ${{ needs.resolve-image.outputs.build-image == 'true' }}
      spring-profile: prod
      deployment-name: production
      service-instance-id: bibbidi-backend-prod
