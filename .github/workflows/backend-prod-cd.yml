name: 비비디 백엔드 운영 CD

on:
  push:
    branches: [release-be]
    paths:
      - "BE/**"
      - "Infra/monitoring/**"
      - "Infra/nginx/**"
      - "Infra/scripts/**"
      - ".github/workflows/backend-*-cd.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-prod-deploy
  cancel-in-progress: false

jobs:
  resolve-image:
    runs-on: ubuntu-24.04
    outputs:
      build-image: ${{ steps.resolve.outputs.build-image }}
      image-tag: ${{ steps.resolve.outputs.image-tag }}
    steps:
      - name: 승격 대상 확인을 위해 전체 Git 이력 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js 버전을 24.19.0으로 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: 운영 이미지 판별 로직 테스트 실행
        run: node --experimental-strip-types --test .github/be-cd-jobs/*.test.ts

      - name: dev-be 승격 또는 release-be hotfix 에서 배포할 이미지 결정
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types .github/be-cd-jobs/cli.ts

  deploy:
    needs: resolve-image
    uses: ./.github/workflows/backend-common-cd.yml
    secrets: inherit
    with:
      deployment-environment: backend-prod
      runner-labels: '["self-hosted", "linux", "ARM64", "prod"]'
      image-tag: ${{ needs.resolve-image.outputs.image-tag }}
      build-image: ${{ needs.resolve-image.outputs.build-image == 'true' }}
      spring-profile: prod
      deployment-name: production
      service-instance-id: bibbidi-backend-prod
