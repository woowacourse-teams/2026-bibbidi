name: Development Logger Cross-platform Test

on:
  pull_request:
    branches:
      - release-be
      - release-fe
      - release-app
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.devlogger.json'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/development-logger-test.yml'
      - 'docs/convention/**'
      - 'packages/development-logger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 20 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run Development Logger tests
        run: node --test packages/development-logger/test/index.test.mjs
