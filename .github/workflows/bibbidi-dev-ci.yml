name: Bibbidi Backend DEV CI

on:
    pull_request:
        branches: ["release-be"]
        paths:
            - "BE/**"
            - ".github/workflows/bibbidi-dev-ci.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: BE

        steps:
            - uses: actions/checkout@v7

            - name: Set up JDK 25
              uses: actions/setup-java@v6
              with:
                  java-version: "25"
                  distribution: "corretto"

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Cache Gradle build outputs
              uses: actions/cache@v4
              with:
                  path: BE/build
                  key: ${{ runner.os }}-java25-gradle-build-${{ hashFiles('BE/build.gradle', 'BE/gradle/**', 'BE/gradlew', 'BE/gradlew.bat', 'BE/src/main/**', 'BE/src/test/**', 'BE/database/**') }}

            - name: Build (test + jacoco + openapi + bootJar)
              run: ./gradlew build

            - name: Upload test report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: test-reports
                  path: |
                      BE/build/reports/tests/test
                      BE/build/reports/jacoco/test/html
                  retention-days: 7
