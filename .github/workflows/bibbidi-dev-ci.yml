name: 비비디 백엔드 CI

on:
    pull_request:
        branches: ["dev-be", "release-be"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: 백엔드 CI 검증
        runs-on: ubuntu-24.04-arm
        defaults:
            run:
                working-directory: BE

        steps:
            - name: 테스트 소스 코드 체크아웃
              uses: actions/checkout@v7

            - name: Corretto JDK 버전 25 설정
              uses: actions/setup-java@v6
              with:
                  java-version: "25"
                  distribution: "corretto"

            - name: Gradle 실행 환경과 의존성 캐시 설정
              uses: gradle/actions/setup-gradle@v6

            - name: Gradle check로 테스트와 JaCoCo 커버리지 검증 실행, JAR 빌드
              run: ./gradlew check bootJar

            - name: Node.js 버전을 24.19.0으로 설정
              if: github.event_name == 'pull_request'
              uses: actions/setup-node@v6
              with:
                  node-version: 24.19.0

            - name: 병합 뒤 CD가 같은 소스인지 확인할 JAR 이름 계산
              if: github.event_name == 'pull_request'
              id: fingerprint
              working-directory: .
              run: node --experimental-strip-types .github/be-cd-jobs/ci-artifact-cli.ts fingerprint

            - name: 테스트를 통과한 JAR 기록
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.fingerprint.outputs.name }}
                  path: BE/build/libs/app.jar
                  retention-days: 14
                  if-no-files-found: error

            - name: 테스트 실패 시 테스트와 JaCoCo 보고서 기록
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: test-reports
                  path: |
                      BE/build/reports/tests/test
                      BE/build/reports/jacoco/test/html
                  retention-days: 7
