name: 비비디 백엔드 CI

on:
    pull_request:
        branches: ["dev-be", "release-be"]
        paths:
            - "BE/**"
            - ".github/workflows/bibbidi-dev-ci.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: BE

        steps:
            - name: 테스트 소스 코드 체크아웃
              uses: actions/checkout@v7

            - name: Corretto JDK 버전 25 설정
              uses: actions/setup-java@v6
              with:
                  java-version: "25"
                  distribution: "corretto"

            - name: Gradle 실행 환경과 의존성 캐시 설정
              uses: gradle/actions/setup-gradle@v6

            - name: 소스 해시 기준으로 Gradle 빌드 결과 캐시
              uses: actions/cache@v4
              with:
                  path: BE/build
                  key: ${{ runner.os }}-java25-gradle-build-${{ hashFiles('BE/build.gradle', 'BE/gradle/**', 'BE/gradlew', 'BE/gradlew.bat', 'BE/src/main/**', 'BE/src/test/**', 'BE/database/**') }}

            - name: Gradle test로 테스트와 JaCoCo 검사 실행
              run: ./gradlew test

            - name: 테스트 실패 시 테스트와 JaCoCo 보고서 기록
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: test-reports
                  path: |
                      BE/build/reports/tests/test
                      BE/build/reports/jacoco/test/html
                  retention-days: 7
