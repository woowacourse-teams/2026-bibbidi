version: 0.2

env:
  shell: bash
  variables:
    NEXT_TELEMETRY_DISABLED: "1"

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - corepack enable
      - corepack prepare pnpm@11.20.0 --activate
      - node --version
      - pnpm --version

  pre_build:
    commands:
      - |
        set -euo pipefail

        case "${CODEBUILD_BUILD_ID:-}" in
          bibbidi-fe-production-build:*) ;;
          *)
            echo "This buildspec is only for the Bibbidi production FE build." >&2
            exit 1
            ;;
        esac

        if [ -z "${BIBBIDI_GA_MEASUREMENT_ID:-}" ]; then
          echo "Missing CodeBuild environment variable: BIBBIDI_GA_MEASUREMENT_ID" >&2
          exit 1
        fi

        pnpm install --frozen-lockfile

  build:
    commands:
      - |
        set -euo pipefail

        node --test infra/frontend/*.test.mjs
        pnpm --filter bibbidi-fe lint
        pnpm --filter bibbidi-fe format:check
        pnpm --filter bibbidi-fe typecheck
        pnpm --filter bibbidi-fe test
        BIBBIDI_CATALOG_API_ORIGIN=https://api.bibbidi.kr \
          BIBBIDI_API_BASE_URL=https://api.bibbidi.kr \
          BIBBIDI_APP_ENV=production \
          FE_SERVICE_URL=https://bibbidi.kr \
          pnpm --filter bibbidi-fe build

        node infra/frontend/stage-release.mjs --production

cache:
  paths:
    - /root/.local/share/pnpm/store/**/*
